name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to be able to publish, and deploy-pages authenticates with OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` runs the asset script first: it copies the MediaPipe
      # wasm runtime out of node_modules and downloads the hand landmarker
      # model, neither of which is committed.
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository the first time this runs, so
          # nobody has to flip the switch in Settings by hand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
